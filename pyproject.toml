[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "task-ai-service"
version = "0.1.0"
description = "Text summarization API with GigaChat, fallback and TTL cache"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[project.scripts]
task-ai-service = "task_ai_service.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/task_ai_service"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["task_ai_service"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 85
