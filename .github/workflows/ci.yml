name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Lint and formatting
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Tests
        run: python -m pytest --cov=task_ai_service --cov-report=term-missing --cov-report=xml
      - name: Build distributions
        run: python -m build
      - name: Install wheel in clean environment and smoke-test
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/python -m pip install -r requirements.txt
          /tmp/wheel-check/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/wheel-check/bin/python "$GITHUB_WORKSPACE/scripts/smoke.py"
      - name: Upload test coverage and packages
        uses: actions/upload-artifact@v4
        with:
          name: build-python-${{ matrix.python-version }}
          path: |
            dist/*
            coverage.xml
